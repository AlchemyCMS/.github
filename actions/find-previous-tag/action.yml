name: Find Previous Tag
description: >
  Find the previous release tag for changelog generation: the highest
  release tag (vMAJOR.MINOR.PATCH) strictly below the version being released.
  This single rule handles minor/major version jumps, patches on old stable
  branches, and first releases without special casing.

inputs:
  version:
    description: 'The new version being released (e.g., 8.2.0)'
    required: true
  github-token:
    description: 'GitHub token for API access'
    required: true

outputs:
  tag:
    description: 'The previous tag found (empty if none)'
    value: ${{ steps.find.outputs.result }}

runs:
  using: composite
  steps:
    - name: Find previous tag
      id: find
      uses: actions/github-script@v9
      with:
        github-token: ${{ inputs.github-token }}
        result-encoding: string
        script: |
          const version = '${{ inputs.version }}';

          // Parse a clean release tag (vMAJOR.MINOR.PATCH) into numbers.
          // Pre-release / suffixed tags (e.g. v8.0.0.rc1, v1.0.0.beta) return
          // null so changelogs are generated against the previous *stable*
          // release, never a pre-release of the same version.
          const parse = (name) => {
            const m = /^v(\d+)\.(\d+)\.(\d+)$/.exec(name);
            return m ? [Number(m[1]), Number(m[2]), Number(m[3])] : null;
          };
          const compare = (a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2];

          const target = parse(`v${version}`);
          if (!target) {
            throw new Error(`Invalid version '${version}', expected MAJOR.MINOR.PATCH`);
          }

          // Fetch every tag (repos can have hundreds, so paginate), then pick
          // the highest release tag strictly below the version being released.
          // Sorting by semver — not relying on API order or string prefixes —
          // is what makes minor/major jumps and patches on old stable branches
          // all resolve correctly.
          const tags = await github.paginate(github.rest.repos.listTags, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });

          const previous = tags
            .map(t => ({ name: t.name, version: parse(t.name) }))
            .filter(t => t.version && compare(t.version, target) < 0)
            .sort((a, b) => compare(b.version, a.version))[0];

          const previousTag = previous ? previous.name : '';
          console.log(`New version: ${version}`);
          console.log(`Previous tag: ${previousTag || 'none'}`);
          return previousTag;
