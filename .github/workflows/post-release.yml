name: Post Release (Reusable)

on:
  workflow_call:
    inputs:
      version_file_path:
        description: 'Path to the version file (e.g., lib/alchemy/solidus/version.rb)'
        required: true
        type: string
      target_branch:
        description: 'Branch to update (defaults to main)'
        required: false
        type: string
        default: 'main'
      gem_name:
        description: 'Name of the gem for announcements (defaults to repo name)'
        required: false
        type: string
      announce:
        description: 'Announce release on social media'
        required: false
        type: boolean
        default: true
      announce_to_rubyflow:
        description: 'Open a GitHub issue to announce minor/major releases on RubyFlow'
        required: false
        type: boolean
        default: false
    secrets:
      app_id:
        description: 'GitHub App ID for authentication'
        required: true
      app_private_key:
        description: 'GitHub App private key for authentication'
        required: true
      slack_webhook_url:
        description: 'Slack incoming webhook URL for release announcements'
        required: false
      mastodon_access_token:
        description: 'Mastodon bot access token'
        required: false
      mastodon_instance:
        description: 'Mastodon instance URL (e.g., https://ruby.social)'
        required: false
      bluesky_identifier:
        description: 'Bluesky handle or DID'
        required: false
      bluesky_password:
        description: 'Bluesky app password'
        required: false

jobs:
  bump-dev-version:
    if: ${{ inputs.target_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.generate-token.outputs.token }}
          ref: main

      - name: Calculate next dev version
        id: version
        run: |
          # Read current version
          CURRENT=$(grep VERSION "${{ inputs.version_file_path }}" | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT"

          # Strip any pre-release suffix to get base version
          BASE_VERSION=$(echo "$CURRENT" | sed 's/\.[a-zA-Z][a-zA-Z0-9]*$//')
          echo "Base version: $BASE_VERSION"

          # Split into major.minor.patch and bump minor
          IFS='.' read -r MAJOR MINOR _ <<< "$BASE_VERSION"
          MINOR=$((MINOR + 1))
          NEW_VERSION="$MAJOR.$MINOR.0.dev"

          echo "New dev version: $NEW_VERSION"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Configure git
        run: |
          git config user.name "alchemycms-bot"
          git config user.email "alchemycms-bot@users.noreply.github.com"

      - name: Bump to dev version
        run: |
          sed -i 's/VERSION = "[^"]*"/VERSION = "${{ steps.version.outputs.version }}"/' ${{ inputs.version_file_path }}

      - name: Create branch, commit and open PR
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          BRANCH="post-release/${{ steps.version.outputs.version }}"
          git checkout -b "$BRANCH"
          git add ${{ inputs.version_file_path }}
          git commit -m "Start development of version ${{ steps.version.outputs.version }}"
          git push origin "$BRANCH"

          gh pr create \
            --base "main" \
            --head "$BRANCH" \
            --title "Start development of version ${{ steps.version.outputs.version }}" \
            --body "Automated version bump after release.

          This PR was automatically created by the post-release workflow." \
            --label "skip-changelog"

  announce:
    if: ${{ inputs.announce }}
    runs-on: ubuntu-latest
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.slack_webhook_url }}
      MASTODON_ACCESS_TOKEN: ${{ secrets.mastodon_access_token }}
      MASTODON_INSTANCE: ${{ secrets.mastodon_instance }}
      BLUESKY_IDENTIFIER: ${{ secrets.bluesky_identifier }}
      BLUESKY_PASSWORD: ${{ secrets.bluesky_password }}

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Get latest release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Post to Slack
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🎉 *${{ inputs.gem_name || github.event.repository.name }} v${{ steps.version.outputs.version }}* has been released!\n\n<${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}|View release notes>"
                  }
                }
              ]
            }

      - name: Post to Mastodon
        if: ${{ env.MASTODON_ACCESS_TOKEN != '' && env.MASTODON_INSTANCE != '' }}
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
            -F "status=🎉 ${{ inputs.gem_name || github.event.repository.name }} v${{ steps.version.outputs.version }} has been released!

          ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}

          #RubyGems #Ruby #Rails #CMS #AlchemyCMS" \
            "$MASTODON_INSTANCE/api/v1/statuses"

      - name: Post to Bluesky
        if: ${{ env.BLUESKY_IDENTIFIER != '' && env.BLUESKY_PASSWORD != '' }}
        uses: cbrgm/bluesky-github-action@v1
        with:
          handle: ${{ env.BLUESKY_IDENTIFIER }}
          password: ${{ env.BLUESKY_PASSWORD }}
          text: |
            🎉 ${{ inputs.gem_name || github.event.repository.name }} v${{ steps.version.outputs.version }} has been released!

            ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}

            #rubygems #ruby #rails #cms #alchemycms

  # RubyFlow has no posting API and requires a GitHub-authenticated session, so
  # we don't post automatically. Instead, for opted-in repos we open a tracking
  # issue containing a ready-to-paste draft for a maintainer to submit by hand.
  announce-rubyflow:
    if: ${{ inputs.announce && inputs.announce_to_rubyflow }}
    runs-on: ubuntu-latest

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_branch }}
          fetch-depth: 0

      - name: Get latest release version
        id: version
        run: |
          VERSION=$(git describe --tags --abbrev=0 | sed 's/^v//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check release is minor or major
        id: check
        run: |
          # RubyFlow announcements are reserved for minor and major releases.
          # The release flow always produces clean X.Y.Z tags, so a zero patch
          # component means this is a minor or major release.
          PATCH=$(echo "${{ steps.version.outputs.version }}" | cut -d. -f3)
          if [ "$PATCH" = "0" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping RubyFlow draft for patch release ${{ steps.version.outputs.version }}"
          fi

      - name: Open RubyFlow draft issue
        if: ${{ steps.check.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          GEM_NAME: ${{ inputs.gem_name || github.event.repository.name }}
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ steps.version.outputs.version }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Announce v$VERSION on RubyFlow" \
            --body "$(cat <<EOF
          A new minor or major version has been released. Announce it on [RubyFlow](https://rubyflow.com) to reach the Ruby community.

          1. Go to https://rubyflow.com/#submitform and sign in with GitHub.
          2. Paste the title and content below (edit as you like).
          3. Close this issue once posted.

          ---

          **Title**

          $GEM_NAME v$VERSION released

          **Content**

          $GEM_NAME v$VERSION has been released! See the release notes for what's new: $RELEASE_URL
          EOF
          )"
