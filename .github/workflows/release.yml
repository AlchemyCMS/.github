name: Publish Release (Reusable)

on:
  workflow_call:
    inputs:
      version_file_path:
        description: 'Path to the version file (e.g., lib/alchemy/solidus/version.rb)'
        required: true
        type: string
      target_branch:
        description: 'The branch this release is being made from (e.g., main, 8.0-stable)'
        required: true
        type: string
    secrets:
      app_id:
        description: 'GitHub App ID for authentication'
        required: true
      app_private_key:
        description: 'GitHub App private key for authentication'
        required: true
      rubygems_api_key:
        description: 'RubyGems API key (Optional). Only used if trusted publishing is not configured for the gem (recommended).'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # alchemy_cms' Gemfile installs ruby-vips when ALCHEMY_STORAGE_ADAPTER is
    # "active_storage" (its default), and ruby-vips needs libvips present on the
    # runner. Forcing "none" skips that during bundle install so we don't have to
    # install libvips just to publish the gem. This is a no-op for gems that
    # don't read this variable.
    env:
      ALCHEMY_STORAGE_ADAPTER: none
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.generate-token.outputs.token }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Release gem to RubyGems
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1

      - name: Get version
        id: version
        run: |
          VERSION=$(grep 'VERSION = "' ${{ inputs.version_file_path }} | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Find previous tag
        id: previous-tag
        uses: AlchemyCMS/.github/actions/find-previous-tag@main
        with:
          version: ${{ steps.version.outputs.version }}
          github-token: ${{ steps.generate-token.outputs.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          previous_tag: ${{ steps.previous-tag.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}

      - name: Trigger post-release workflow
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=post-release \
            -f "client_payload[target_branch]=${{ inputs.target_branch }}"
